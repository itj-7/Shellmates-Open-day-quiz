<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shellmates: Who Said It? (Resident Evil)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Oswald:wght@400;500;600&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #150709;
        --card: #1d0b0f;
        --card2: #26101510;
        --card3: #2a1217;
        --line: #4a1a22;
        --red: #8a0d18;
        --red2: #b01220;
        --red3: #e0283a;
        --ink: #f2e6e4;
        --mute: #a38a8c;
        --r: 16px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
        max-width: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Oswald",
          system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        transition: filter 0.6s;
        background:
          radial-gradient(
            80% 50% at 50% 0%,
            rgba(176, 18, 32, 0.38),
            transparent 70%
          ),
          radial-gradient(
            70% 45% at 85% 100%,
            rgba(110, 14, 30, 0.45),
            transparent 70%
          ),
          radial-gradient(
            60% 40% at 5% 70%,
            rgba(70, 12, 40, 0.4),
            transparent 70%
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.018) 0 2px,
            transparent 2px 14px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(0, 0, 0, 0.18) 0 2px,
            transparent 2px 14px
          ),
          linear-gradient(180deg, #2a0d12, #160709 55%, #10050a);
      }
      body.lost .bg {
        filter: saturate(1.8) brightness(1.15);
      }
      .fog {
        position: fixed;
        left: -40%;
        right: -40%;
        height: 40%;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          closest-side,
          rgba(220, 150, 160, 0.12),
          transparent
        );
        animation: drift 24s linear infinite alternate;
        will-change: transform;
      }
      .fog.a {
        top: 25%;
      }
      .fog.b {
        bottom: 2%;
        animation-duration: 34s;
        animation-direction: alternate-reverse;
      }
      @keyframes drift {
        from {
          transform: translateX(-14%);
        }
        to {
          transform: translateX(14%);
        }
      }
      .vig {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.6)
        );
        animation: flick 9s steps(1) infinite;
      }
      @keyframes flick {
        0%,
        90%,
        94%,
        100% {
          opacity: 1;
        }
        91% {
          opacity: 0.7;
        }
        93% {
          opacity: 0.88;
        }
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        padding: 0 18px 30px;
        overflow-x: clip;
      }
      .scene {
        display: block;
        width: calc(100% + 36px);
        margin: 0 -18px;
        height: auto;
      }
      .w1 {
        animation: wf 3.2s steps(1) infinite;
      }
      .w2 {
        animation: wf 4.6s steps(1) infinite 0.8s;
      }
      .w3 {
        animation: wf 5.4s steps(1) infinite 1.7s;
      }
      @keyframes wf {
        0%,
        100% {
          opacity: 0.9;
        }
        40% {
          opacity: 0.25;
        }
        44% {
          opacity: 0.9;
        }
        70% {
          opacity: 0.5;
        }
      }
      .eye {
        animation: bl 6s steps(1) infinite;
      }
      @keyframes bl {
        0%,
        94%,
        100% {
          opacity: 1;
        }
        96% {
          opacity: 0;
        }
      }
      .term {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 13px;
        color: var(--mute);
        padding: 10px 0 14px;
      }
      .term b {
        color: var(--red3);
        font-weight: 400;
      }
      .term i {
        display: inline-block;
        width: 8px;
        height: 14px;
        background: var(--red3);
        vertical-align: -2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      h1 {
        font-family: "Nosifer", "Creepster", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(24px, 8.5vw, 34px);
        overflow-wrap: anywhere;
        line-height: 1.25;
        margin: 2px 0 6px;
        text-transform: uppercase;
        color: var(--red3);
        text-shadow: 0 2px 0 #3a0409;
      }
      h1 small {
        display: block;
        font-family: "Creepster", Impact, sans-serif;
        font-size: 30px;
        letter-spacing: 0.08em;
        color: var(--ink);
        text-shadow: none;
        margin-top: 4px;
      }
      .rule {
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--red3), transparent);
        margin: 12px 0 16px;
      }
      p {
        margin: 0 0 12px;
        color: #dbc6c8;
        line-height: 1.55;
        font-size: 17px;
      }
      .screen {
        animation: in 0.28s ease-out both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        margin: 14px 0;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-family: "Creepster", Impact, sans-serif;
        font-weight: 400;
        font-size: 24px;
        letter-spacing: 0.08em;
        color: var(--red3);
      }
      .panel ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel li {
        padding: 9px 0;
        border-top: 1px solid var(--line);
        font-size: 17px;
        color: #ecdcdc;
      }
      .panel li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .tiers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tier {
        border: 1px solid var(--red2);
        border-radius: 14px;
        background: var(--card3);
        padding: 12px 8px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 13px;
        color: var(--mute);
      }
      .tier strong {
        display: block;
        font-family: "Creepster", Impact, sans-serif;
        font-weight: 400;
        font-size: 44px;
        color: var(--ink);
        letter-spacing: 0.02em;
        line-height: 1.05;
      }
      .tier span {
        display: block;
        margin-top: 2px;
        color: var(--red3);
        font-weight: 600;
        font-size: 16px;
      }
      .btn {
        display: block;
        width: 100%;
        min-height: 60px;
        border: 1px solid var(--red3);
        border-radius: var(--r);
        background: linear-gradient(180deg, var(--red2), var(--red));
        color: #fff;
        font:
          600 19px "Oswald",
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.1s,
          opacity 0.2s;
        margin-top: 18px;
      }
      .btn:active:not([disabled]) {
        transform: scale(0.98);
      }
      .btn[disabled] {
        opacity: 0.4;
        cursor: default;
        background: var(--card3);
        border-color: var(--line);
        color: var(--mute);
      }
      .prog {
        display: flex;
        gap: 4px;
        margin: 14px 0 12px;
      }
      .prog i {
        flex: 1;
        height: 6px;
        border-radius: 4px;
        background: #3a161c;
        transition: background 0.3s;
      }
      .prog i.d {
        background: var(--red2);
      }
      .prog i.c {
        background: var(--red3);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
        margin-bottom: 12px;
      }
      .meta b {
        color: var(--ink);
        font-weight: 500;
      }
      .quote {
        background: linear-gradient(180deg, #34141b, #210b11);
        border: 1px solid var(--red2);
        border-radius: 20px;
        margin-bottom: 18px;
        overflow: hidden;
      }
      .qh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 16px;
        background: rgba(0, 0, 0, 0.4);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .qh > span:first-child::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red3);
        margin-right: 9px;
        animation: blink 1.4s steps(1) infinite;
      }
      .wave {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 16px;
      }
      .wave i {
        width: 3px;
        height: 100%;
        border-radius: 2px;
        background: var(--red3);
        animation: eq 1s ease-in-out infinite;
      }
      .wave i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .wave i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .wave i:nth-child(4) {
        animation-delay: 0.1s;
      }
      .wave i:nth-child(5) {
        animation-delay: 0.3s;
      }
      @keyframes eq {
        0%,
        100% {
          transform: scaleY(0.2);
        }
        50% {
          transform: scaleY(1);
        }
      }
      .qb {
        padding: 28px 22px 30px;
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 23px;
        line-height: 1.45;
        color: #fff;
        text-align: center;
      }
      .qm {
        font-family: "Creepster", Impact, sans-serif;
        font-size: 46px;
        color: var(--red3);
        line-height: 0;
        vertical-align: -14px;
        margin: 0 5px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Creepster", Impact, sans-serif;
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 0.1em;
        color: var(--red3);
        margin: 16px 0 10px;
      }
      .step::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .opt {
        min-height: 62px;
        padding: 10px 12px;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 14px;
        font:
          500 17px/1.2 "Oswald",
          sans-serif;
        letter-spacing: 0.03em;
        text-align: center;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .opt:active {
        transform: scale(0.97);
      }
      .opt.sel {
        background: linear-gradient(180deg, var(--red2), var(--red));
        border-color: var(--red3);
        color: #fff;
      }
      .icon {
        display: block;
        margin: 12px auto 0;
        width: 96px;
        height: 96px;
      }
      .word span {
        display: inline-block;
        white-space: nowrap;
      }
      .score {
        font-family: "Creepster", Impact, sans-serif;
        font-size: 100px;
        line-height: 1;
        margin: 8px 0 4px;
        color: var(--red3);
        text-align: center;
      }
      .score small {
        font-size: 34px;
        color: var(--mute);
      }
      .verdict {
        border: 1px solid var(--red3);
        border-radius: var(--r);
        background: var(--card3);
        padding: 18px 14px;
        text-align: center;
        margin: 16px 0;
      }
      .verdict .big {
        font-family: "Creepster", Impact, sans-serif;
        font-size: 38px;
        letter-spacing: 0.05em;
      }
      .verdict .sub {
        margin-top: 4px;
        color: var(--red3);
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .verdict .hint {
        margin-top: 6px;
        color: var(--mute);
        font-size: 14px;
      }
      .code {
        font-family: "Special Elite", "Courier New", monospace;
        color: var(--mute);
        font-size: 14px;
        text-align: center;
        margin-top: 12px;
        line-height: 1.6;
      }
      .dead {
        text-align: center;
        padding-top: 6px;
        max-width: 100%;
        overflow: hidden;
      }
      .dead .word {
        font-family: "Nosifer", "Creepster", Impact, sans-serif;
        font-size: 48px; /* real size is fitted to the screen by JS */
        max-width: 100%;
        overflow-wrap: anywhere;
        line-height: 1.15;
        color: var(--red3);
        text-shadow:
          3px 0 #000,
          -3px 0 #5d0710;
        animation: shake 0.5s steps(2) infinite;
      }
      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-3px, 2px);
        }
        50% {
          transform: translate(3px, -2px);
        }
        75% {
          transform: translate(-2px, -1px);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      #flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #c1111f;
        pointer-events: none;
        opacity: 0;
        animation: fl 1.6s linear 1 both;
      }
      @keyframes fl {
        0% {
          opacity: 0.95;
        }
        10% {
          opacity: 0;
        }
        20% {
          opacity: 0.85;
        }
        30% {
          opacity: 0;
        }
        42% {
          opacity: 0.7;
        }
        54% {
          opacity: 0;
        }
        66% {
          opacity: 0.4;
        }
        100% {
          opacity: 0;
        }
      }
      .foot {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 13px;
        color: var(--mute);
        text-align: center;
        margin-top: 26px;
      }
      .field {
        margin: 14px 0 0;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .field input {
        display: block;
        width: 100%;
        min-height: 58px;
        padding: 10px 14px;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 14px;
        font:
          400 20px "Special Elite",
          "Courier New",
          monospace;
        outline: 0;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .field input::placeholder {
        color: #6e575a;
      }
      .field input:focus {
        border-color: var(--red3);
        box-shadow: 0 0 0 3px rgba(224, 40, 58, 0.28);
      }
      .btn.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--ink);
        margin-top: 10px;
      }
      .tag {
        font-weight: 600;
      }
      .tag.t1 {
        color: #c9b6b6;
      }
      .tag.t2 {
        color: #f06a4a;
      }
      .tag.t3 {
        color: var(--red3);
        animation: blink 1.2s steps(1) infinite;
      }
      .board {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .board li {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        font-size: 18px;
        color: #ecdcdc;
      }
      .board li:first-child {
        border-top: 0;
      }
      .board .rk {
        font-family: "Creepster", Impact, sans-serif;
        font-size: 24px;
        color: var(--mute);
        text-align: center;
      }
      .board li:nth-child(-n + 3) .rk {
        color: var(--red3);
      }
      .board .nm {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .board .sc {
        font-family: "Creepster", Impact, sans-serif;
        font-size: 26px;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .board .tm {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 13px;
        color: var(--mute);
      }
      .board li.me {
        background: rgba(224, 40, 58, 0.14);
        margin: 0 -10px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 10px;
        border-top-color: transparent;
      }
      .panel h3 small {
        font-family: "Oswald", system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--mute);
        margin-left: 10px;
      }
      .rv {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .rv li {
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .rv li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .rv li:last-child {
        padding-bottom: 0;
      }
      .rv .meta {
        margin-bottom: 8px;
      }
      .rv .rq {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 18px;
        line-height: 1.4;
        color: #fff;
        margin: 0 0 10px;
      }
      .rv .ra {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 10px;
        padding: 6px 0;
        font-size: 17px;
        line-height: 1.3;
      }
      .rv .lb {
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--mute);
        padding-top: 3px;
      }
      .rv .ra.ok .av {
        color: var(--ink);
      }
      .rv .ra.bad .av {
        color: var(--red3);
      }
      .rv .av em {
        display: block;
        font-style: normal;
        font-size: 14px;
        color: var(--mute);
        margin-top: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .fog,
        .vig,
        .screen,
        .term i,
        .w1,
        .w2,
        .w3,
        .eye,
        .wave i,
        .qh > span:first-child::before,
        .dead .word,
        .tag.t3,
        #flash {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="fog a"></div>
    <div class="fog b"></div>
    <div class="vig"></div>
    <div class="wrap">
      <svg class="scene" viewBox="0 0 520 150" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a0a12" />
            <stop offset="1" stop-color="#1a0709" />
          </linearGradient>
          <radialGradient id="mg">
            <stop offset="0" stop-color="#e0283a" stop-opacity=".55" />
            <stop offset="1" stop-color="#e0283a" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#150709" stop-opacity="0" />
            <stop offset="1" stop-color="#150709" />
          </linearGradient>
        </defs>
        <rect width="520" height="150" fill="url(#sky)" />
        <circle cx="410" cy="48" r="56" fill="url(#mg)" />
        <circle cx="410" cy="48" r="26" fill="#d8c2bc" opacity=".75" />
        <circle cx="401" cy="42" r="5" fill="#b29a95" opacity=".6" />
        <circle cx="418" cy="56" r="3" fill="#b29a95" opacity=".6" />
        <path
          d="M330 28q5-7 10 0q5-7 10 0M360 16q4-6 8 0q4-6 8 0M300 44q4-5 8 0q4-5 8 0"
          fill="none"
          stroke="#080204"
          stroke-width="2"
        />
        <path
          fill="#070204"
          d="M140 150V86h18V66l12-22 12 22v14h28V62l24-34 24 34v18h28V66l12-22 12 22v20h18v64Z"
        />
        <rect class="w1" x="166" y="92" width="8" height="12" fill="#e0283a" />
        <rect class="w2" x="258" y="86" width="10" height="14" fill="#f06a4a" />
        <rect class="w3" x="338" y="92" width="8" height="12" fill="#e0283a" />
        <rect x="256" y="118" width="14" height="32" rx="7" fill="#1a0709" />
        <g stroke="#070204" stroke-linecap="round" fill="none">

        function fmt(n) {

          h +=
            '<div class="step">Who said it?</div><div class="grid" id="gc">' +
            S.cOpts
              .map(function (c, k) {
                return (
                  '<button class="opt" data-k="' +
                  k +
                  '">' +
                  esc(c) +
                  "</button>"
                );
              })
              .join("") +
            "</div>";
          h +=
            '<div class="step">Which game?</div><div class="grid" id="gg">' +
            S.gOpts
              .map(function (g, k) {
                return (
                  '<button class="opt" data-k="' +
                  k +
                  '">' +
                  esc(GAMES[g]) +
                  "</button>"
                );
              })
              .join("") +
            "</div>";
          h +=
            '<button class="btn" id="lock" disabled>' +
            (S.i === ROUNDS - 1 ? "Finish" : "Lock answer") +
            "</button></section>";
          app.innerHTML = h;
          window.scrollTo(0, 0);
          bind("gc", function (k) {
            S.pc = S.cOpts[k];
          });
          bind("gg", function (k) {
            S.pg = S.gOpts[k];
          });
          document.getElementById("lock").onclick = lock;
        }
        function bind(id, set) {
          var box = document.getElementById(id),
            bs = box.querySelectorAll(".opt");
          box.onclick = function (e) {
            var b = e.target.closest(".opt");
            if (!b) return;
            for (var n = 0; n < bs.length; n++) bs[n].classList.remove("sel");
            b.classList.add("sel");
            set(+b.getAttribute("data-k"));
            document.getElementById("lock").disabled =
              S.pc === null || S.pg === null;
          };
        }
        function lock() {
          var r = S.qs[S.i],
            okC = [].concat(r.who).indexOf(S.pc) > -1,
            okG = [].concat(r.game).indexOf(S.pg) > -1;
          (S.log = S.log || []).push({
            d: r.d,
            q: r.q,
            who: [].concat(r.who),
            game: [].concat(r.game),
            pc: S.pc,
            pg: S.pg,
            okC: okC,
            okG: okG,
          });
          S.score += (okC ? 0.5 : 0) + (okG ? 0.5 : 0);
          S.i++;
          if (S.i >= ROUNDS) finish();
          else round();
        }
        function fit() {
          var w = document.querySelector(".dead .word");
          if (!w) return;
          var max = w.parentNode.clientWidth - 8,
            size = Math.min(66, window.innerWidth * 0.15),
            spans = w.querySelectorAll("span");
          w.style.fontSize = size + "px";
          var n = 0;
          while (n++ < 40 && size > 16) {
            var widest = 0;
            for (var i = 0; i < spans.length; i++)
              widest = Math.max(widest, spans[i].offsetWidth);
            if (widest <= max) break;
            size -= 2;
            w.style.fontSize = size + "px";
          }
        }
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        function finish() {
          var sc = S.score,
            tk = sc >= 10 ? 2 : sc >= 8 ? 1 : 0;
          var d = new Date();
          S.t = Math.round((d.getTime() - S.t0) / 1000);
          var code =
            "SM-" +
            Math.random().toString(36).slice(2, 6).toUpperCase() +
            "-" +
            String(d.getHours()).padStart(2, "0") +
            String(d.getMinutes()).padStart(2, "0") +
            String(d.getSeconds()).padStart(2, "0");
          var rk = record();
          var info =
            '<div class="code">' +
            esc(S.name) +
            ' &middot; <span id="rk">' +
            rk +
            "</span>" +
            "<br>" +
            code +
            " &middot; " +
            mmss(S.t) +
            "<br>" +
            esc(d.toLocaleString()) +
            "</div>" +
            '<button class="btn" id="sb">Scoreboard</button><button class="btn ghost" id="rv">Review answers</button><button class="btn ghost" id="nw">New player</button>';
          if (tk === 0) {
            var word = Math.random() < 0.5 ? "You are dead" : "Infected";
            document.body.classList.add("lost");
            show(
              '<div id="flash"></div><section class="screen dead">' +
                SKULL +
                '<div class="word">' +
                word
                  .split(" ")
                  .map(function (w) {
                    return "<span>" + w + "</span>";
                  })
                  .join(" ") +
                "</div>" +
                '<div class="score">' +
                fmt(sc) +
                "<small> / 10</small></div>" +
                '<div class="verdict"><div class="big">No peseta this time</div><div class="hint">8 points for 1 peseta, 10 for 2</div></div>' +
                info +
                "</section>",
            );
            if (navigator.vibrate) {
              try {
                navigator.vibrate([200, 80, 200, 80, 400]);
              } catch (x) {}
            }
          } else {
            var big = tk === 2 ? "Perfect survivor" : "You made it out";
            show(
              '<section class="screen">' +
                KEY +
                '<div class="score">' +
                fmt(sc) +
                "<small> / 10</small></div>" +
                '<div class="verdict"><div class="big">' +
                big +
                '</div><div class="sub">' +
                (tk === 2 ? "2 pesetas" : "1 peseta") +
                '</div><div class="hint">Show this screen to a staff member</div></div>' +
                info +
                "</section>",
            );
          }
          sync();
        }
        intro();
      })();
    </script>
  </body>
</html>
